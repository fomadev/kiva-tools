name: Release

# Pushing a tag v* (git tag v1.0.0 && git push origin v1.0.0) builds and tests
# the extension, packages it as a .vsix, and publishes a GitHub release with
# that file and the section of CHANGELOG.md for this version.
# Publishing on the Marketplace stays manual: download the .vsix from the
# release and upload it to the fomadev publisher.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Check that the tag, package.json and CHANGELOG.md agree
        run: node scripts/release-notes.mjs --check "$GITHUB_REF_NAME"

      - run: npm ci

      - name: Install KivaDB, for the test against a real server
        run: curl -sSL https://raw.githubusercontent.com/fomadev/kiva-db/main/install.sh | bash
        continue-on-error: true

      - run: npm test

      - name: Package the extension
        id: package
        run: |
          file="$(node -p "require('./package.json').name")-$(node -p "require('./package.json').version").vsix"
          npx vsce package --out "$file"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Write the release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release-notes.md
          files: ${{ steps.package.outputs.file }}
          fail_on_unmatched_files: true
